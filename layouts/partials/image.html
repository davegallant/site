<!-- prettier-ignore -->
{{ if .caption }}
  <figure>
{{ end }}

{{ if (strings.HasPrefix .src "http") }}
  <!-- External image -->
  <img
    src="{{ .src }}"
    alt="{{ .alt }}"
    {{ with .caption }}title="{{ . | markdownify | plainify }}"{{ end }}
    {{ if .lazy }}loading="lazy"{{ end }}
  />
{{ else if (strings.HasPrefix .src "/") }}
  <!-- Image from static/ -->
  {{ $imageConfig := imageConfig (path.Join "static" .src) }}
  <img
    src="{{ .src }}"
    alt="{{ .alt }}"
    {{ with .caption }}title="{{ . | markdownify | plainify }}"{{ end }}
    {{ if .lazy }}loading="lazy"{{ end }}
    width="{{ $imageConfig.Width }}"
    height="{{ $imageConfig.Height }}"
  />
{{ else }}
  {{ $src := .src }}
  {{ if strings.HasPrefix $src "./" }}
    <!-- Strip "./" prefix from relative path -->
    {{ $src = substr $src 2 }}
  {{ end }}
  <!-- Image from page bundle -->
  {{ $images := .page.Resources.ByType "image" }}
  {{ $image := $images.GetMatch $src }}
  {{ if eq $image.MediaType.SubType "svg" }}
    <!-- No processing for SVGs -->
    <img src="{{ $image.RelPermalink }}" alt="{{ .alt }}" />
  {{ else if eq $image.MediaType.SubType "gif" }}
    <!-- No processing for GIFs: Hugo's resize/webp pipeline re-encodes animated
         GIFs far less efficiently than the source encoder, often producing
         files larger than the original -->
    <img
      src="{{ $image.RelPermalink }}"
      alt="{{ .alt }}"
      {{ with .caption }}title="{{ . | markdownify | plainify }}"{{ end }}
      {{ if .lazy }}loading="lazy"{{ end }}
      width="{{ $image.Width }}"
      height="{{ $image.Height }}"
    />
  {{ else }}
    {{/* Cover the 860px content column at up to 2x pixel density. */}}
    {{ $maxWidth := .page.Site.Params.imageResize.max | default 1720 }}
    {{ $widths := slice }}
    {{ range (slice 360 540 700 860 1080 1400 1720) }}
      {{ if and (le . $maxWidth) (lt . $image.Width) }}
        {{ $widths = $widths | append . }}
      {{ end }}
    {{ end }}
    {{ $widths = $widths | append (math.Min $image.Width $maxWidth | int) | uniq | sort }}
    {{ $displayWidth := math.Min $image.Width 860 | int }}
    {{ $sizes := printf "(max-width: %dpx) calc(100vw - 2.2rem), %dpx" (add $displayWidth 36) $displayWidth }}
    {{ $srcSet := slice }}
    {{ $webpSrcSet := slice }}
    {{ range $width := $widths }}
      {{ if ge $image.Width $width }}
        {{ $resized := $image.Resize (printf "%dx" $width) }}
        {{ $srcSet = $srcSet | append (printf "%s %dw" $resized.RelPermalink $resized.Width) }}
        {{ if not (in (slice "webp" "png") $image.MediaType.SubType) }}
          <!-- Keep PNG screenshots lossless; use high-quality WebP for photos. -->
          {{ $webp := $image.Resize (printf "%dx webp q90" $width) }}
          {{ $webpSrcSet = $webpSrcSet | append (printf "%s %dw" $webp.RelPermalink $webp.Width) }}
        {{ end }}
      {{ end }}
    {{ end }}


    <picture>
      {{ if $webpSrcSet }}
        <source
          type="image/webp"
          {{ with $webpSrcSet }}srcset="{{ delimit . "," }}"{{ end }}
          {{ with $sizes }}sizes="{{ . }}"{{ end }}
        />
      {{ end }}
      <img
        src="{{ $image.RelPermalink }}"
        {{ with $srcSet }}srcset="{{ delimit . "," }}"{{ end }}
        sizes="{{ $sizes }}"
        alt="{{ .alt }}"
        {{ with .caption }}title="{{ . | markdownify | plainify }}"{{ end }}
        {{ if .lazy }}loading="lazy"{{ end }}
        width="{{ $image.Width }}"
        height="{{ $image.Height }}"
      />
    </picture>
  {{ end }}
{{ end }}


<!-- prettier-ignore -->
{{ if .caption }}
    <figcaption>{{ .page.RenderString .caption }}</figcaption>
  </figure>
{{ end }}
