{{ define "main" }}
  <div class="content-section">
    <h1 class="visually-hidden">{{ .Title }}</h1>
    <form
      class="search"
      action="{{ "/search/" | relURL }}"
      method="get"
      role="search"
    >
      <div class="search__controls">
        <input
          id="search-input"
          name="q"
          type="search"
          placeholder="Search posts…"
          aria-label="Search posts"
        />
        <button type="submit">Search</button>
      </div>
    </form>
    <div id="search-results" aria-live="polite"></div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var query = (params.get("q") || "").trim();
      var resultsEl = document.getElementById("search-results");
      if (!resultsEl) return;
      var searchInput = document.getElementById("search-input");
      if (searchInput) searchInput.value = query;
      if (!query) {
        resultsEl.textContent = "Enter a search term to find posts.";
        return;
      }

      function highlight(element, text, query) {
        var lowerText = text.toLowerCase();
        var lowerQuery = query.toLowerCase();
        var pos = 0;
        var idx;
        while ((idx = lowerText.indexOf(lowerQuery, pos)) !== -1) {
          element.appendChild(document.createTextNode(text.slice(pos, idx)));
          var mark = document.createElement("mark");
          mark.textContent = text.slice(idx, idx + query.length);
          element.appendChild(mark);
          pos = idx + query.length;
        }
        element.appendChild(document.createTextNode(text.slice(pos)));
      }

      fetch("/search-index.json")
        .then(function (res) {
          return res.json();
        })
        .then(function (pages) {
          var q = query.toLowerCase();
          var matches = pages.filter(function (p) {
            return (
              p.title.toLowerCase().indexOf(q) !== -1 ||
              p.content.toLowerCase().indexOf(q) !== -1 ||
              (p.tags || []).some(function (t) {
                return t.toLowerCase().indexOf(q) !== -1;
              })
            );
          });

          resultsEl.innerHTML = "";
          var heading = document.createElement("p");
          if (matches.length === 0) {
            heading.textContent = 'No results for "' + query + '".';
            resultsEl.appendChild(heading);
            return;
          }
          heading.textContent =
            matches.length +
            (matches.length === 1 ? " result" : " results") +
            ' for "' +
            query +
            '":';
          resultsEl.appendChild(heading);

          var list = document.createElement("ul");
          matches.forEach(function (m) {
            var li = document.createElement("li");
            var a = document.createElement("a");
            a.href = m.href;
            highlight(a, m.title, query);
            li.appendChild(a);
            if (m.summary) {
              var desc = document.createElement("p");
              highlight(desc, m.summary, query);
              li.appendChild(desc);
            }
            list.appendChild(li);
          });
          resultsEl.appendChild(list);
        })
        .catch(function () {
          resultsEl.textContent = "Search is temporarily unavailable.";
        });
    })();
  </script>
{{ end }}
