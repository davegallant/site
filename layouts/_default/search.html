{{ define "main" }}
  <div class="content-section">
    <h1>{{ .Title }}</h1>
    <div id="search-results" aria-live="polite"></div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var query = (params.get("q") || "").trim();
      var resultsEl = document.getElementById("search-results");
      if (!resultsEl) return;
      var headerInput = document.getElementById("search-header-input");
      if (headerInput && query) headerInput.value = query;
      if (!query) {
        resultsEl.textContent =
          "Use the search box in the header to search posts.";
        return;
      }

      function escapeHtml(str) {
        return str.replace(/[&<>"']/g, function (c) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[c];
        });
      }

      function highlight(text, q) {
        var safeText = escapeHtml(text);
        var safeQuery = escapeHtml(q);
        if (!safeQuery) return safeText;
        var lowerText = safeText.toLowerCase();
        var lowerQuery = safeQuery.toLowerCase();
        var out = "";
        var pos = 0;
        var idx;
        while ((idx = lowerText.indexOf(lowerQuery, pos)) !== -1) {
          out += safeText.slice(pos, idx);
          out +=
            "<mark>" + safeText.slice(idx, idx + safeQuery.length) + "</mark>";
          pos = idx + safeQuery.length;
        }
        return out + safeText.slice(pos);
      }

      fetch("/search-index.json")
        .then(function (res) {
          return res.json();
        })
        .then(function (pages) {
          var q = query.toLowerCase();
          var matches = pages.filter(function (p) {
            return (
              p.title.toLowerCase().indexOf(q) !== -1 ||
              p.content.toLowerCase().indexOf(q) !== -1 ||
              (p.tags || []).some(function (t) {
                return t.toLowerCase().indexOf(q) !== -1;
              })
            );
          });

          resultsEl.innerHTML = "";
          var heading = document.createElement("p");
          if (matches.length === 0) {
            heading.textContent = 'No results for "' + query + '".';
            resultsEl.appendChild(heading);
            return;
          }
          heading.textContent =
            matches.length +
            (matches.length === 1 ? " result" : " results") +
            ' for "' +
            query +
            '":';
          resultsEl.appendChild(heading);

          var list = document.createElement("ul");
          matches.forEach(function (m) {
            var li = document.createElement("li");
            var a = document.createElement("a");
            a.href = m.href;
            a.innerHTML = highlight(m.title, query);
            li.appendChild(a);
            if (m.summary) {
              var desc = document.createElement("p");
              desc.innerHTML = highlight(m.summary, query);
              li.appendChild(desc);
            }
            list.appendChild(li);
          });
          resultsEl.appendChild(list);
        })
        .catch(function () {
          resultsEl.textContent = "Search is temporarily unavailable.";
        });
    })();
  </script>
{{ end }}
